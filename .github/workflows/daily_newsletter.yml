name: Daily Cars Never Die Newsletter

on:
  schedule:
    # Runs daily at 11:00 AM UTC (7:00 AM EST)
    - cron: '0 11 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI anytime

permissions:
  contents: write

jobs:
  run-daily-newsletter:
    name: Generate & Publish Daily Newsletter
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Newsletter Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUCTION_API_KEY: ${{ secrets.AUCTION_API_KEY }}
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUBLICATION_ID: ${{ secrets.BEEHIIV_PUBLICATION_ID }}
          BEEHIIV_POST_STATUS: "confirmed"
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          SOCIAL_POSTING_API_KEY: ${{ secrets.SOCIAL_POSTING_API_KEY }}
        run: python agents.py

      - name: Commit and push updated editorial memory and social media assets
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add editorial_memory.json output_social_caption.txt 2>/dev/null || true
          git add output_reel.mp4 output_reel.gif 2>/dev/null || true
          git add archives/*.txt archives/*.json 2>/dev/null || true
          git diff-index --quiet HEAD || git commit -m "Update daily editorial memory log & social media assets [skip ci]"
          git pull --rebase origin main || true
          git push origin main

